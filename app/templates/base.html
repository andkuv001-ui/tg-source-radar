<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TG Source Radar{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        nav { background: #1a1a2e; padding: 12px 0; border-bottom: 1px solid #333; margin-bottom: 24px; }
        nav .container { display: flex; align-items: center; justify-content: space-between; }
        nav a { color: #7c83ff; text-decoration: none; font-weight: 600; font-size: 18px; }
        nav .links a { color: #aaa; font-size: 14px; margin-left: 20px; }
        nav .links a:hover { color: #fff; }
        h1 { font-size: 24px; margin-bottom: 16px; color: #fff; }
        h2 { font-size: 20px; margin-bottom: 12px; color: #ccc; }
        input[type="text"], textarea { width: 100%; padding: 10px 14px; background: #1a1a2e; border: 1px solid #333; border-radius: 6px; color: #fff; font-size: 14px; margin-bottom: 12px; }
        input:focus, textarea:focus { outline: none; border-color: #7c83ff; }
        button { padding: 10px 24px; background: #7c83ff; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; }
        button:hover { background: #6b72e8; }
        button:disabled { background: #444; cursor: not-allowed; }
        .btn-secondary { background: #333; }
        .btn-secondary:hover { background: #444; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid #222; }
        th { background: #1a1a2e; color: #aaa; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; position: sticky; top: 0; }
        tr:hover td { background: #1a1a2e; }
        .score { font-weight: 700; padding: 3px 8px; border-radius: 4px; font-size: 13px; }
        .score-high { background: #0d3320; color: #4ade80; }
        .score-mid { background: #3d2e0d; color: #facc15; }
        .score-low { background: #3d0d0d; color: #f87171; }
        .status { padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .status-completed { background: #0d3320; color: #4ade80; }
        .status-searching, .status-evaluating { background: #1a2e3d; color: #60a5fa; }
        .status-failed { background: #3d0d0d; color: #f87171; }
        .status-pending { background: #2a2a2a; color: #888; }
        a { color: #7c83ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #333; border-top-color: #7c83ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty { text-align: center; padding: 40px; color: #666; }
        .card { background: #1a1a2e; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
        label { display: block; margin-bottom: 4px; color: #aaa; font-size: 13px; }
        .badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; white-space: nowrap; }
        .badge-green { background: #0d3320; color: #4ade80; }
        .badge-blue { background: #1a2e3d; color: #60a5fa; }
        .badge-red { background: #3d0d0d; color: #f87171; }
        .badge-yellow { background: #3d2e0d; color: #facc15; }
        .badge-gray { background: #2a2a2a; color: #888; }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="/">TG Source Radar</a>
            <div class="links">
                <a href="/">Поиск</a>
                <a href="/history">История</a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>

services:
  app:
    build: .
    ports:
      - "8010:8000"
    env_file: .env
    volumes:
      - telethon_sessions:/app/sessions
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  telethon_sessions:
